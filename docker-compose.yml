x-citebot-environment: &citebot-environment
  RUNTIME_MODE: offline
  DATABASE_URL: sqlite+aiosqlite:////data/citebot.db
  QDRANT_URL: http://qdrant:6333
  INGESTION_EXECUTION_MODE: queued
  INGESTION_MAX_DOCUMENTS: "600"
  ALLOW_LOCAL_DENSE_FALLBACK: "false"
  OBJECT_STORAGE_PATH: /data/raw_documents
  STRUCTURED_DOCUMENT_PATH: /data/structured_documents
  SPARSE_INDEX_PATH: /data/sparse_index.sqlite3
  EMBEDDING_BASE_URL: http://embedding:8081
  LLM_BASE_URL: http://llm:8082/v1
  MODEL_MANIFEST_PATH: /models/manifest.lock.json
  OCR_MODEL_PATH: /models/paddleocr
  SAMPLE_CORPUS_PATH: /app/data/sample_corpus
  SAMPLE_CORPUS_AUTO_INGEST: "true"

services:
  model-provision:
    build:
      context: .
    command: ["python", "scripts/provision_local_models.py", "--ensure"]
    environment:
      MODEL_ARTIFACT_ROOT: /models
      HF_ENDPOINT: ${HF_ENDPOINT:-https://huggingface.co}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_MAX_RETRIES: ${HF_MAX_RETRIES:-5}
      HF_RETRY_BACKOFF_SECONDS: ${HF_RETRY_BACKOFF_SECONDS:-2}
      EMBEDDING_MODEL_REPOSITORY: ${EMBEDDING_MODEL_REPOSITORY:-BAAI/bge-small-en-v1.5}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-main}
      LLM_MODEL_REPOSITORY: ${LLM_MODEL_REPOSITORY:-bartowski/microsoft_Phi-4-mini-instruct-GGUF}
      LLM_MODEL_REVISION: ${LLM_MODEL_REVISION:-main}
      LLM_MODEL_FILENAME: ${LLM_MODEL_FILENAME:-microsoft_Phi-4-mini-instruct-Q4_K_M.gguf}
      OCR_DETECTION_MODEL_REPOSITORY: ${OCR_DETECTION_MODEL_REPOSITORY:-PaddlePaddle/PP-OCRv6_tiny_det}
      OCR_DETECTION_MODEL_REVISION: ${OCR_DETECTION_MODEL_REVISION:-main}
      OCR_RECOGNITION_MODEL_REPOSITORY: ${OCR_RECOGNITION_MODEL_REPOSITORY:-PaddlePaddle/PP-OCRv6_tiny_rec}
      OCR_RECOGNITION_MODEL_REVISION: ${OCR_RECOGNITION_MODEL_REVISION:-main}
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models
    networks:
      - model_download
    restart: "no"

  model-preflight:
    build:
      context: .
    command: ["python", "scripts/verify_model_manifest.py"]
    environment:
      MODEL_MANIFEST_PATH: /models/manifest.lock.json
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    depends_on:
      model-provision:
        condition: service_completed_successfully
    restart: "no"

  api:
    build:
      context: .
    environment:
      <<: *citebot-environment
      APP_ENV: ${APP_ENV:-development}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "127.0.0.1:${CITEBOT_PORT:-8000}:8000"
    depends_on:
      model-preflight:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 1g
    cpus: "1.5"
    restart: unless-stopped

  caddy:
    image: caddy:2.10.2-alpine
    depends_on:
      dozzle:
        condition: service_started
    ports:
      - target: 80
        published: "${CITEBOT_HTTP_PORT:-80}"
        host_ip: 0.0.0.0
        protocol: tcp
      - target: 8888
        published: "${DOZZLE_HTTP_PORT:-8888}"
        host_ip: 0.0.0.0
        protocol: tcp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public_edge
      - citebot_internal
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped

  document-worker:
    build:
      context: .
    command: ["citebot-worker"]
    environment:
      <<: *citebot-environment
      APP_ENV: development
      INGESTION_WORKER_ID: document-worker
    depends_on:
      model-preflight:
        condition: service_completed_successfully
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    depends_on:
      model-preflight:
        condition: service_completed_successfully
    command:
      - --model-id
      - /models/bge-small-en-v1.5
      - --port
      - "8081"
      - --max-batch-tokens
      - "1024"
      - --max-client-batch-size
      - "4"
      - --max-concurrent-requests
      - "8"
    expose:
      - "8081"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      RAYON_NUM_THREADS: "2"
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: "2.0"
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b9404
    depends_on:
      model-preflight:
        condition: service_completed_successfully
    command:
      - -m
      - /models/phi-4-mini-instruct-q4.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - -c
      - "4096"
      - --offline
    expose:
      - "8082"
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    networks:
      - citebot_internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/8082;
          printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 5g
    cpus: "4.0"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - citebot_internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -ec 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          IFS= read -r status <&3;
          [[ "$$status" == *" 200 "* ]]'
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: "1.5"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: citebot
      POSTGRES_PASSWORD: citebot
      POSTGRES_DB: citebot
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebot -d citebot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    networks:
      - citebot_internal

  dozzle:
    image: amir20/dozzle:v10.6.2
    environment:
      DOZZLE_BASE: /dozzle
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - citebot_internal

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  qdrant_data:

networks:
  citebot_internal:
    internal: true
  model_download:
  public_edge:
