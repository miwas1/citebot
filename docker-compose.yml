x-citebot-environment: &citebot-environment
  RUNTIME_MODE: offline
  DATABASE_URL: sqlite+aiosqlite:////data/citebot.db
  QDRANT_URL: http://qdrant:6333
  INGESTION_EXECUTION_MODE: queued
  ALLOW_LOCAL_DENSE_FALLBACK: "false"
  OBJECT_STORAGE_PATH: /data/raw_documents
  STRUCTURED_DOCUMENT_PATH: /data/structured_documents
  SPARSE_INDEX_PATH: /data/sparse_index.sqlite3
  EMBEDDING_BASE_URL: http://embedding:8081
  LLM_BASE_URL: http://llm:8082/v1
  MODEL_MANIFEST_PATH: /models/manifest.lock.json
  OCR_MODEL_PATH: /models/paddleocr

services:
  api:
    build:
      context: .
    environment:
      <<: *citebot-environment
      APP_ENV: ${APP_ENV:-development}
      RESEARCH_API_KEY: ${RESEARCH_API_KEY:-}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    ports:
      - "127.0.0.1:${CITEBOT_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 1g
    cpus: "1.5"
    restart: unless-stopped

  document-worker:
    build:
      context: .
    command: ["citebot-worker"]
    environment:
      <<: *citebot-environment
      APP_ENV: development
      INGESTION_WORKER_ID: document-worker
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    security_opt:
      - no-new-privileges:true
    init: true
    mem_limit: 2g
    cpus: "2.0"
    restart: unless-stopped

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    command:
      - --model-id
      - /models/bge-small-en-v1.5
      - --port
      - "8081"
      - --max-batch-tokens
      - "1024"
      - --max-client-batch-size
      - "4"
      - --max-concurrent-requests
      - "8"
    expose:
      - "8081"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      RAYON_NUM_THREADS: "2"
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: "2.0"
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server-b9404
    command:
      - -m
      - /models/phi-4-mini-instruct-q4.gguf
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - -c
      - "4096"
      - --offline
    expose:
      - "8082"
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    environment:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 5g
    cpus: "4.0"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.2
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: "1.5"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.2-pg18
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: citebot
      POSTGRES_PASSWORD: citebot
      POSTGRES_DB: citebot
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebot -d citebot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    networks:
      - citebot_internal

  dozzle:
    image: amir20/dozzle:v10.6.2
    profiles: ["observability"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8888:8080"
    networks:
      - citebot_internal

volumes:
  postgres_data:
  qdrant_data:

networks:
  citebot_internal:
    internal: true
