services:
  api:
    build:
      context: .
    environment:
      APP_ENV: development
      RUNTIME_MODE: offline
      API_PREFIX: /api/v1
      DATABASE_URL: sqlite+aiosqlite:////data/citebot.db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-citebot_chunks_qwen3_v2}
      ENABLE_QDRANT: "true"
      ENABLE_PGVECTOR: "false"
      VECTOR_BACKEND: qdrant
      INGESTION_EXECUTION_MODE: queued
      OBJECT_STORAGE_PATH: /data/raw_documents
      STRUCTURED_DOCUMENT_PATH: /data/structured_documents
      SPARSE_INDEX_PATH: /data/sparse_index.json
      EMBEDDING_PROVIDER: local-http
      EMBEDDING_BASE_URL: http://embedding:8081
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      EMBEDDING_VERSION: ${EMBEDDING_VERSION:-qwen3-0.6b-v1}
      ANSWER_PROVIDER: llama-cpp
      ANSWER_MODEL: ${ANSWER_MODEL:-phi-4-mini-instruct-q4}
      LLM_BASE_URL: http://llm:8082/v1
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-8192}
      MODEL_MANIFEST_PATH: /models/manifest.lock.json
      OCR_PROVIDER: ${OCR_PROVIDER:-paddleocr}
      OCR_MODEL_PATH: /models/paddleocr
      OCR_FALLBACK_PROVIDER: ${OCR_FALLBACK_PROVIDER:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-en}
      EVALUATION_EVALUATOR_PROVIDER: local
      ALLOW_WEB_SEARCH_DEFAULT: "false"
    ports:
      - "127.0.0.1:${CITEBOT_PORT:-8000}:8000"
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    security_opt:
      - no-new-privileges:true

  document-worker:
    build:
      context: .
    command: ["citebot-worker"]
    environment:
      APP_ENV: development
      RUNTIME_MODE: offline
      DATABASE_URL: sqlite+aiosqlite:////data/citebot.db
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-citebot_chunks_qwen3_v2}
      ENABLE_QDRANT: "true"
      ENABLE_PGVECTOR: "false"
      VECTOR_BACKEND: qdrant
      INGESTION_EXECUTION_MODE: queued
      INGESTION_WORKER_ID: ${INGESTION_WORKER_ID:-document-worker}
      OBJECT_STORAGE_PATH: /data/raw_documents
      STRUCTURED_DOCUMENT_PATH: /data/structured_documents
      SPARSE_INDEX_PATH: /data/sparse_index.json
      EMBEDDING_PROVIDER: local-http
      EMBEDDING_BASE_URL: http://embedding:8081
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1024}
      ANSWER_PROVIDER: llama-cpp
      ANSWER_MODEL: ${ANSWER_MODEL:-phi-4-mini-instruct-q4}
      LLM_BASE_URL: http://llm:8082/v1
      MODEL_MANIFEST_PATH: /models/manifest.lock.json
      OCR_PROVIDER: ${OCR_PROVIDER:-paddleocr}
      OCR_MODEL_PATH: /models/paddleocr
      OCR_FALLBACK_PROVIDER: ${OCR_FALLBACK_PROVIDER:-tesseract}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-en}
    depends_on:
      qdrant:
        condition: service_healthy
      embedding:
        condition: service_healthy
      llm:
        condition: service_healthy
    volumes:
      - ./storage:/data
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    security_opt:
      - no-new-privileges:true

  embedding:
    image: ${EMBEDDING_IMAGE:-ghcr.io/huggingface/text-embeddings-inference:cpu-1.7}
    command:
      - --model-id
      - ${EMBEDDING_MODEL_PATH:-/models/Qwen3-Embedding-0.6B}
      - --port
      - "8081"
    expose:
      - "8081"
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  llm:
    image: ${LLM_IMAGE:-ghcr.io/ggerganov/llama.cpp:server}
    command:
      - -m
      - ${LLM_MODEL_PATH:-/models/phi-4-mini-instruct-q4.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8082"
      - -c
      - ${LLM_CONTEXT_TOKENS:-8192}
      - --offline
    expose:
      - "8082"
    volumes:
      - ${MODEL_ARTIFACT_ROOT:-./models}:/models:ro
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.4
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - citebot_internal
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:6333/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12

  postgres:
    image: pgvector/pgvector:pg17
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: citebot
      POSTGRES_PASSWORD: citebot
      POSTGRES_DB: citebot
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U citebot -d citebot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql:ro
    networks:
      - citebot_internal

  dozzle:
    image: amir20/dozzle:v8.12.12
    profiles: ["observability"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-8888}:8080"
    networks:
      - citebot_internal

volumes:
  postgres_data:
  qdrant_data:

networks:
  citebot_internal:
    internal: true
