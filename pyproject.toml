[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "citebot"
version = "0.1.0"
description = "Offline privacy-first document RAG assistant with structured OCR and local inference."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
  "aiosqlite>=0.22.1,<1.0.0",
  "asyncpg>=0.31.0,<1.0.0",
  "fastapi>=0.141.1,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "langgraph>=1.2.10,<2.0.0",
  "pydantic-settings>=2.15.0,<3.0.0",
  "python-dotenv>=1.2.2,<2.0.0",
  "requests>=2.34.2,<3.0.0",
  "pymupdf>=1.28.2,<2.0.0",
  "sqlalchemy>=2.0.51,<3.0.0",
  "uvicorn[standard]>=0.52.1,<1.0.0"
]

[project.scripts]
citebot-ingest = "app.ingestion.cli:main"
citebot-worker = "app.ingestion.worker:main"
citebot-retrieval-harness = "app.evaluation.retrieval_harness:main"
citebot-eval = "app.evaluation.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10.0.0",
  "pytest-asyncio>=1.4.0,<2.0.0",
  "pytest-cov>=7.1.0,<8.0.0",
  "ruff>=0.16.2,<1.0.0"
]
evaluation = [
  "datasets>=5.0.1,<6.0.0",
  "ragas>=0.4.3,<1.0.0"
]
ocr = [
  "paddleocr==3.7.0",
  "paddlepaddle==3.3.1"
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "ragas_ci: stable evaluation subset for the CiteBot quality gate"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
